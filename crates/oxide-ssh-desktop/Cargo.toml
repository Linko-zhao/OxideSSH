[package]
name = "oxide-ssh-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "oxide-ssh"

[[bin]]
name = "oxide-ssh"
path = "src/main.rs"

[dependencies]
alacritty_terminal.workspace = true
async-channel.workspace = true
bytes.workspace = true
directories.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
keyring.workspace = true
oxide-ssh-app.workspace = true
oxide-ssh-core.workspace = true
oxide-ssh-terminal.workspace = true
parking_lot.workspace = true
secrecy.workspace = true
sys-locale.workspace = true
uuid.workspace = true
thiserror.workspace = true

# macOS: sets the Dock icon at runtime so bare `cargo run`/`cargo build`
# binaries show the app icon without an .app bundle. Versions match gpui's
# transitive objc2 stack.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
